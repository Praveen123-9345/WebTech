    <ul type="square">
        <li>item1</li>
        <li>item2</li>
        <li>item3</li>

         <ul>
            <li>Bringe</li>
            <li>Sambar Rice</li>

            <li>Lemon Rice</li>

         <li>Non Veg</li>
           <ul>
            <li>Chicken Briyani</li>
            <li>Mutton Briyani</li>
            <li>Beaf Briyani</li>
            <li>Fish</li>
           </ul>
    </ol>
