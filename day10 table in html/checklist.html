<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h2>Rowspan and Colspan😎</h2>
    <table border="">
        <caption>Check List</caption>
        <thead>
            <tr>
                <th>SI.NO</th>
                <th>ITEMS</th>
                <th>PRICES</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td>1</td>
                <td>Shirt</td>
                <td rowspan="2">&#8377;6200</td>
            </tr>
            <tr>
                <td>2</td>
                <td>Jeants</td>
            </tr>
            <tr>
                <td>3</td>
                <td>RC Car</td>
                <td rowspan="2">&#8377;12800</td>
            </tr>
            <tr>
                <td>4</td>
                <td>Cells</td>
            </tr>
        </tbody>
        <tfoot>
            <tr>
                <td colspan="2">Total</td>
                <td>&#8377;19000</td>
            </tr>
        </tfoot>
    </table>
</body>
</html>
